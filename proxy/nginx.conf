# One origin: /api/* goes to the backend (prefix stripped), everything else to the PWA.
# Plain HTTP inside the Docker network; HTTPS comes from the Cloudflare Tunnel later.
server {
    listen 80;
    server_tokens off;

    location = /proxy-health {
        default_type text/plain;
        return 200 "ok";
    }

    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web:8080;
        proxy_set_header Host $host;
    }
}
