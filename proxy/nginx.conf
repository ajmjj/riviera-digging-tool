# One origin: /api/* goes to the backend (prefix stripped), everything else to the PWA.
# Plain HTTP inside the Docker network; HTTPS comes from the Cloudflare Tunnel later.
# Upstreams are variables resolved through Docker's DNS, not names fixed at startup, so a
# recreated api or web container (e.g. `make up-dev` changing their env) is found again.
server {
    listen 80;
    server_tokens off;
    resolver 127.0.0.11 valid=2s ipv6=off;

    location = /proxy-health {
        default_type text/plain;
        return 200 "ok";
    }

    location /api/ {
        set $api_upstream http://api:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $web_upstream http://web:8080;
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
    }
}
