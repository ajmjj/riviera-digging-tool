# Dashboard providers (001/FR-022, FR-024, FR-026). The JSON is generated by
# packages/telemetry/src/dashboards/write.ts (`make dashboards`) and read-only in Grafana.
# Each provider has its own directory: Grafana scans a provider's path recursively, so nesting
# slo/ under the Service path would load the SLO dashboards twice.
apiVersion: 1

providers:
  - name: slos
    folder: SLOs
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards/slo

  - name: service
    folder: Service
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards/service
