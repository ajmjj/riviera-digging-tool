name: riviera-dig

# Everything runs with `docker compose up`. Nothing is published to the internet: every
# published port binds to 127.0.0.1 only. The observability stack (001) sits behind the profile
# `observability` (`make up-observability`, `make up-dev`); the app services never depend on it.
# The Cloudflare Tunnel (`cloudflared`) joins later behind its own profile.

x-node-service: &node-service
  build:
    context: .
    dockerfile: docker/api.Dockerfile
  image: riviera-dig/api:local
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  environment: &node-env
    DATABASE_URL: postgres://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:?set in .env}
    APP_URL: ${APP_URL:?set in .env}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    # Empty unless `make up-observability` / `make up-dev` sets it (research R9).
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    # Sample flows: off unless `make up-dev` or CI turns them on (research R17).
    SAMPLE_FLOWS_ENABLED: ${SAMPLE_FLOWS_ENABLED:-false}
    DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
    COMMON_GROUND_URL: ${COMMON_GROUND_URL:-}
    DISCOGS_URL: ${DISCOGS_URL:-}

services:
  db:
    build:
      context: .
      dockerfile: docker/db.Dockerfile
    image: riviera-dig/db:local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  api:
    <<: *node-service
    command: ["node", "apps/api/src/main.ts", "api"]
    environment:
      <<: *node-env
      PORT: "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/readyz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  worker:
    <<: *node-service
    command: ["node", "apps/api/src/main.ts", "worker"]
    environment:
      <<: *node-env
      WORKER_PORT: "3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/readyz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: riviera-dig/web:local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  proxy:
    image: nginx:1.31.9-alpine-slim@sha256:5bfced78d24d644270bedb0a9968697042e38d5c03fb6354603df025279c1cbe
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PROXY_PORT:-8080}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/proxy-health"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  # Common Ground and Discogs mocks (contracts/mocks.md, 001/FR-013): development and CI only
  # (profile `dev`, research R17), never on the plain stack. Not published; the api reaches it
  # on the compose network at http://mocks:4000.
  mocks:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: docker/mocks.Dockerfile
    image: riviera-dig/mocks:local
    restart: unless-stopped
    environment:
      PORT: "4000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  # --- Profile `observability` (001/FR-021): research R7, R8, R10 ---

  otel-collector:
    profiles: [observability]
    build:
      context: .
      dockerfile: docker/otel-collector.Dockerfile
    image: riviera-dig/otel-collector:local
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    ports:
      - "127.0.0.1:${OTEL_COLLECTOR_PORT:-4318}:4318"
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "--spider", "http://127.0.0.1:8888/metrics"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  loki:
    profiles: [observability]
    build:
      context: .
      dockerfile: docker/loki.Dockerfile
    image: riviera-dig/loki:local
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "--spider", "http://127.0.0.1:3100/ready"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  tempo:
    profiles: [observability]
    build:
      context: .
      dockerfile: docker/tempo.Dockerfile
    image: riviera-dig/tempo:local
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "--spider", "http://127.0.0.1:3200/ready"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-otlp-receiver
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Data sources and dashboard folders are provisioned (001/FR-022); anonymous visitors are
  # Viewers. The admin password comes only from .env: an empty GRAFANA_ADMIN_PASSWORD stops this
  # service (and only this one) instead of falling back to Grafana's default password.
  grafana:
    profiles: [observability]
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - 'test -n "$$GF_SECURITY_ADMIN_PASSWORD" || { echo "GRAFANA_ADMIN_PASSWORD is not set in .env" >&2; exit 1; }; exec /run.sh'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3300}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  pgdata:
  loki-data:
  tempo-data:
  prometheus-data:
  grafana-data:
