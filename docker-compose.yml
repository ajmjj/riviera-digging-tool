name: riviera-dig

# Everything runs with `docker compose up`. Nothing is published to the internet: the proxy
# binds to 127.0.0.1 only. The Cloudflare Tunnel (`cloudflared`) and the observability stack
# (001) join later behind their own profiles.

x-node-service: &node-service
  build:
    context: .
    dockerfile: docker/api.Dockerfile
  image: riviera-dig/api:local
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  environment: &node-env
    DATABASE_URL: postgres://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:?set in .env}
    APP_URL: ${APP_URL:?set in .env}
    LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  db:
    build:
      context: .
      dockerfile: docker/db.Dockerfile
    image: riviera-dig/db:local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  api:
    <<: *node-service
    command: ["node", "apps/api/src/main.ts", "api"]
    environment:
      <<: *node-env
      PORT: "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/readyz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  worker:
    <<: *node-service
    command: ["node", "apps/api/src/main.ts", "worker"]
    environment:
      <<: *node-env
      WORKER_PORT: "3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/readyz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: riviera-dig/web:local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  proxy:
    image: nginx:1.31.9-alpine-slim@sha256:5bfced78d24d644270bedb0a9968697042e38d5c03fb6354603df025279c1cbe
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PROXY_PORT:-8080}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/proxy-health"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  # Common Ground and Discogs mocks (contracts/mocks.md, 001/FR-013): development and CI only
  # (profile `dev`, research R17), never on the plain stack. Not published; the api reaches it
  # on the compose network at http://mocks:4000.
  mocks:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: docker/mocks.Dockerfile
    image: riviera-dig/mocks:local
    restart: unless-stopped
    environment:
      PORT: "4000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

volumes:
  pgdata:
