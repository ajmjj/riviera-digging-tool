version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      patch:
        update-types: [patch]
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/setup]
    # These bumps always change .github/, a protected path. Setting labels replaces
    # Dependabot's defaults, so the default two are listed too.
    labels: [dependencies, github_actions, needs-human]
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
