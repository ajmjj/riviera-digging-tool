# Required checks that run on the PR's own code (constitution, Quality Gates).
# Every job runs on every PR; checks that don't apply yet pass trivially and say why.
# Changing this file needs Antn's approval (human-gate), so a PR can't quietly weaken it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Format
        run: pnpm exec prettier --check .
      - name: Lint (strict, zero warnings)
        run: pnpm exec eslint . --max-warnings 0
      - name: Type check (strict)
        run: node ci/typecheck.ts
      - name: Dead code and unused dependencies
        run: pnpm exec knip
      - name: Common Ground clients are generated from the contracts and up to date
        run: |
          pnpm exec graphql-codegen --config codegen.ts
          git diff --exit-code -- packages/common-ground/src/generated \
            || { echo "Generated Common Ground clients are stale: run pnpm codegen and commit."; exit 1; }
      - name: SLO metrics exist and are exported
        run: node ci/slo-check.ts

  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:19-alpine@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: riviera_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/riviera_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Unit and integration tests with coverage thresholds
        run: pnpm exec vitest run --coverage
      - name: Diff coverage
        if: github.event_name == 'pull_request'
        run: node ci/diff-coverage.ts
      - name: Flake guard (unit)
        if: github.event_name == 'pull_request'
        run: node ci/flake-guard.ts unit
      - name: Flake guard (integration)
        if: github.event_name == 'pull_request'
        run: node ci/flake-guard.ts integration
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  mutation:
    name: mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Mutation testing on domain code
        run: node ci/mutation.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 14

  stack:
    name: stack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # 002 (research R8, task T001). Every compose call in this job adds the email capture file, so
    # the api writes sign-in emails to ./.captured-mail/ and never sends one; SMTP_URL is never set.
    # Browsers and the sign-in helpers use the APP_URL origin (from T009 a request from
    # 127.0.0.1 has a foreign Origin and gets 403). INITIAL_ADMIN_EMAIL is the CI first admin, read by
    # compose at both stack-ups and by the sign-in helpers of later tasks.
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.capture.yml
      APP_URL: http://localhost:8080
      E2E_BASE_URL: http://localhost:8080
      INITIAL_ADMIN_EMAIL: admin@ci.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Playwright version
        id: playwright
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' package.json)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The browser install doesn't need the stack, so it runs in the background while the
      # images build. Tests run headless only, so the headless shell is all they need.
      # No --with-deps: ubuntu-24.04 already has the shell's libraries, and the extra fonts
      # and Mesa upgrades it pulled took 2 to 7 minutes from a slow apt mirror.
      - name: Start Playwright browser install (in the background)
        run: |
          # `|| status=$?` so a failed install still writes its exit code under `bash -e`.
          ( status=0
            pnpm exec playwright install --only-shell chromium \
              > "$RUNNER_TEMP/pw-install.log" 2>&1 || status=$?
            echo "$status" > "$RUNNER_TEMP/pw-install.exit" ) &
      # Both profiles, so the mocks and the derived observability images are built here and
      # Trivy scans these local builds instead of pulling anything (research R11).
      - name: Build every image
        id: build
        run: |
          cp .env.example .env
          docker compose --profile dev --profile observability build
      # The plain stack runs as `ci`, not production: production refuses to start without real
      # SMTP settings (002/FR-036). The session secret is the fixed dev placeholder.
      - name: Stack comes up with every healthcheck green within the limit
        env:
          DEPLOYMENT_ENVIRONMENT: ci
          SESSION_SECRET: dev-only-session-secret-0000000000000000
        run: |
          limit=$(jq -r .composeStartupSeconds ci/thresholds.json)
          # Fresh capture directory, writable by the api's `node` user (uid 1000, not the runner's).
          sudo rm -rf .captured-mail
          mkdir .captured-mail
          sudo chown 1000:1000 .captured-mail
          docker compose up --detach --wait --wait-timeout "$limit"
          docker compose ps
      - name: Smoke test
        run: node ci/smoke.ts
      - name: Wait for the Playwright browser install
        run: |
          for _ in $(seq 300); do
            [ -f "$RUNNER_TEMP/pw-install.exit" ] && break
            sleep 2
          done
          cat "$RUNNER_TEMP/pw-install.log"
          [ -f "$RUNNER_TEMP/pw-install.exit" ] \
            || { echo "Playwright install did not finish within 10 minutes."; exit 1; }
          exit "$(cat "$RUNNER_TEMP/pw-install.exit")"
      - name: End-to-end tests (phone and laptop, axe)
        run: pnpm exec playwright test
      - name: Flake guard (e2e)
        if: github.event_name == 'pull_request'
        run: node ci/flake-guard.ts e2e
      # 001 (research R14/R15). The plain stack above has no telemetry endpoint and passed the
      # smoke test (US5-1). Now the dev and observability profiles, on fresh volumes (the check
      # asserts the SLO panels are empty before its samples), with the sample flows of R17. The
      # Common Ground key is the fixed mock placeholder `make up-dev` uses: the mock accepts any.
      - name: Stack with the dev and observability profiles comes up healthy within the limit
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
          SAMPLE_FLOWS_ENABLED: "true"
          DEPLOYMENT_ENVIRONMENT: ci
          COMMON_GROUND_URL: http://mocks:4000
          DISCOGS_URL: http://mocks:4000
          COMMON_GROUND_DEV_API_KEY: dev-only-mock-key
          SESSION_SECRET: dev-only-session-secret-0000000000000000
        run: |
          limit=$(jq -r .composeStartupSeconds ci/thresholds.json)
          docker compose down --volumes
          sudo rm -rf .captured-mail
          mkdir .captured-mail
          sudo chown 1000:1000 .captured-mail
          docker compose --profile dev --profile observability up --detach --wait --wait-timeout "$limit"
          docker compose --profile dev --profile observability ps
      # The proxy re-resolves the recreated api and web (PR #45); this is its end-to-end check.
      - name: Smoke test after the profile switch
        run: node ci/smoke.ts
      - name: End-to-end observability check (FR-033)
        run: node ci/obs-check.ts
      # Each sample request enqueues a job; measure with an empty queue (review of #52).
      - name: Wait for the job queue to drain (before the baseline)
        run: ci/wait-job-queue.sh
      - name: Sample request latency with the collector running (SC-006 baseline)
        run: node ci/latency.ts baseline "$RUNNER_TEMP/latency-baseline.json"
      - name: Stop the collector
        run: docker compose --profile dev --profile observability stop otel-collector
      - name: Smoke test with the collector stopped (US5-2)
        run: node ci/smoke.ts
      - name: Wait for the job queue to drain (before the comparison)
        run: ci/wait-job-queue.sh
      - name: Sample request latency with the collector stopped (SC-006)
        run: node ci/latency.ts compare "$RUNNER_TEMP/latency-baseline.json"
      # The scan runs whenever the images built, even if a stack step above failed, so its result
      # is always shown (review of #52).
      - name: Install Trivy (pinned, checksum verified)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          TRIVY_VERSION: 0.76.2
          TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
        run: |
          curl -sSfL -o /tmp/trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tgz" | sha256sum --check
          tar -xzf /tmp/trivy.tgz -C /tmp trivy
      # Every image is scanned and reported; exceptions apply only as ci/trivy-scan.sh describes.
      - name: Scan every image in the stack (fail on high or critical)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ci/trivy-scan.sh
      - name: Compose logs
        if: failure()
        run: docker compose --profile dev --profile observability logs --no-color
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Stop stack
        if: always()
        run: docker compose --profile dev --profile observability down --volumes

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install gitleaks (pinned, checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Secret scan of this PR's commits
        if: github.event_name == 'pull_request'
        run: /tmp/gitleaks git --redact --no-banner --log-opts="${BASE_SHA}..HEAD" .
      - name: Secret scan of the full history
        run: /tmp/gitleaks git --redact --no-banner .
      - name: Built frontend bundle contains no secret-shaped strings
        run: |
          pnpm --filter @riviera/web build
          /tmp/gitleaks dir --redact --no-banner apps/web/dist
          if grep -rEi "common.?ground.*(key|token)|discogs.*token|sk-ant-|BEGIN [A-Z ]*PRIVATE KEY" apps/web/dist; then
            echo "Secret-shaped strings found in the frontend bundle."; exit 1
          fi
      - name: Dependency audit (fail on high or critical)
        run: pnpm audit --audit-level high
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Semgrep SAST (fail on high-severity findings)
        run: |
          python -m pip install --disable-pip-version-check semgrep==1.186.0
          semgrep scan --config p/default --config p/typescript --config p/secrets \
            --severity ERROR --error --metrics off
