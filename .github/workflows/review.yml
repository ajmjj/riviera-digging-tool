# Independent reviewer (constitution, Quality Gates). Runs from main's definitions
# (`pull_request_target`) with a fresh context, on Antn's Claude subscription.
#
#   1. prepare: main's code fetches the PR through the API into .review/input.md
#   2. claude:  Claude Code reads that file (Read tool only) and returns structured findings
#   3. post:    main's code validates them, posts a PR review, and fails on any blocking one
#
# The PR's code is never checked out or run. Needs the repository secret
# CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`), and the same Dependabot secret so
# dependency-update PRs get reviewed too. Without it the check fails closed.
name: Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # to post the review
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check the subscription token is configured
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN is not set, so the independent review cannot run. Failing closed."
            exit 1
          fi
      - name: Prepare the PR material
        id: prep
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node ci/reviewer-prepare.ts
      - name: Review with Claude
        id: claude
        if: steps.prep.outputs.ready == 'true'
        continue-on-error: true # the post step turns any failure into a blocking finding
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: dependabot[bot]
          allow_fork_prs: "false"
          prompt: ${{ steps.prep.outputs.prompt }}
          claude_args: >-
            --model claude-opus-5-5
            --allowedTools Read
            --disallowedTools Bash,Edit,Write,MultiEdit,NotebookEdit,WebFetch,WebSearch,Task
            --json-schema '${{ steps.prep.outputs.schema }}'
      - name: Post the review and set the check result
        if: always() && steps.prep.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ steps.prep.outputs.head_sha }}
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
        run: node ci/reviewer-post.ts
