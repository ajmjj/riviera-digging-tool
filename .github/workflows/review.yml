# Independent reviewer (constitution, Quality Gates). Runs from main's definitions
# (`pull_request_target`) with a fresh context. It installs main's locked dependencies and
# reads the PR only through the API; it never checks out or runs the PR's code.
# Needs the repository secret ANTHROPIC_API_KEY (and the same Dependabot secret, so
# dependency-update PRs get reviewed too).
name: Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # to post the review
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Review the PR against the constitution, spec and plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY is not set, so the independent review cannot run. Failing closed."
            exit 1
          fi
          node ci/reviewer.ts
