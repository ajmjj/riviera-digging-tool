# Serves the built PWA. Unknown paths fall back to index.html (client-side routing).
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri /index.html;
    }
}
